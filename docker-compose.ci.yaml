services:
  minio:
    image: ohc-minio:ci
    pull_policy: build
    build:
      context: .
      dockerfile: docker/minio/Dockerfile.ci

  backend:
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgres://postgres:postgres@db:5432/care
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379

  celery:
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgres://postgres:postgres@db:5432/care
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379
