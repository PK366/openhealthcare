name: Frontend Build

on:
  pull_request:
    branches:
      - staging
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  push:
    branches:
      - staging
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

concurrency:
  group: frontend-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          REACT_CARE_API_URL: https://example.invalid/api
          REACT_APP_TITLE: CARE CI
          REACT_APP_META_DESCRIPTION: Frontend build validation
          REACT_PUBLIC_URL: https://example.invalid
          REACT_APP_COVER_IMAGE: https://example.invalid/cover.png
          REACT_APP_COVER_IMAGE_ALT: https://example.invalid/cover-alt
          REACT_RECAPTCHA_SITE_KEY: ci-placeholder

      - name: Upload frontend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7
