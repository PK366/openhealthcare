name: Test

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
    inputs:
      event_name:
        required: false
        type: string
        default: "pull_request"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      COMPOSE_FILE: docker-compose.yaml:docker-compose.local.yaml:docker-compose.ci.yaml
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Docker layers cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.buildx-mounted-cache
          key: ${{ runner.os }}-${{ runner.arch }}-buildx-dev-${{ hashFiles('Pipfile.lock', 'docker/dev.Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-buildx-dev-

      - name: inject cache into docker
        uses: reproducible-containers/buildkit-cache-dance@v3.3.0
        with:
          cache-map: |
            {
              "${{ runner.temp }}/.buildx-mounted-cache": "/root/.cache/pip"
            }
          skip-extraction: ${{ steps.cache-restore.outputs.cache-hit }}

      - name: Create new cache
        run: |
          mkdir -p ${{ runner.temp }}/.buildx-cache
          mkdir -p ${{ runner.temp }}/.buildx-cache-new
          mkdir -p ${{ runner.temp }}/.buildx-mounted-cache

      - name: Build images
        run: |
          docker buildx build \
            --file docker/dev.Dockerfile \
            --tag care_local \
            --cache-from=type=local,src=${{ runner.temp }}/.buildx-cache \
            --cache-to=type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max \
            --platform linux/arm64 \
            --load \
            .

      - name: Start services
        run: |
          docker compose up -d --wait || (docker compose logs && exit 1)

      - name: Check missing migrations
        run: make checkmigration

      - name: Validate integrity of fixtures
        run: make load-fixtures

      - name: Dump db
        if: ${{ inputs.event_name == 'push' || github.event_name == 'push' }}
        run: make dump-db

      - name: Run tests
        run: make test-coverage

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Check Codecov token availability
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage report
        if: steps.codecov.outputs.enabled == 'true'
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

      - name: Save Docker layers cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.buildx-mounted-cache
          key: ${{ runner.os }}-${{ runner.arch }}-buildx-dev-${{ hashFiles('Pipfile.lock', 'docker/dev.Dockerfile') }}

      # Upload dummy db as artifact so it can be used to speed up frontend tests
      - name: Dump db
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: make dump-db

      - name: Collect Docker Compose diagnostics on failure
        if: failure()
        run: |
          mkdir -p "${{ runner.temp }}/ci-diagnostics"
          docker compose ps --all > "${{ runner.temp }}/ci-diagnostics/compose-ps.txt" 2>&1 || true
          docker compose logs --no-color --tail=200 > "${{ runner.temp }}/ci-diagnostics/compose-logs.txt" 2>&1 || true

      - name: Redact sensitive values from CI diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          diagnostics = Path(os.environ["RUNNER_TEMP"]) / "ci-diagnostics"
          if not diagnostics.exists():
              raise SystemExit(0)

          assignment = re.compile(
              r'(?i)(\b(?:password|passwd|pwd|token|access[_-]?key|secret|'
              r'client[_-]?secret|api[_-]?key|authorization|private[_-]?key)\b'
              r'\s*[:=]\s*)(?:"[^"\r\n]*"|\'[^\'\r\n]*\'|[^\s,;&]+)'
          )
          query_value = re.compile(
              r'(?i)([?&](?:password|passwd|token|access[_-]?key|secret|'
              r'api[_-]?key|client[_-]?secret)=)[^&\s]+'
          )
          bearer = re.compile(r'(?i)(\bBearer\s+)[A-Za-z0-9._~+/=-]+')
          url_credentials = re.compile(r'(?i)(://)[^/@\s:]+:[^/@\s]+@')
          private_key = re.compile(
              r'(?s)(-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----).*?'
              r'(-----END [A-Z0-9 ]*PRIVATE KEY-----)'
          )

          for path in diagnostics.glob("*.txt"):
              data = path.read_text(errors="replace")
              data = private_key.sub(r'\1[REDACTED PRIVATE KEY]\2', data)
              data = assignment.sub(r'\1[REDACTED]', data)
              data = query_value.sub(r'\1[REDACTED]', data)
              data = bearer.sub(r'\1[REDACTED]', data)
              data = url_credentials.sub(r'\1[REDACTED]@', data)
              data = re.sub(r'\bAKIA[0-9A-Z]{16}\b', '[REDACTED AWS KEY]', data)
              data = re.sub(r'\bgh[pousr]_[A-Za-z0-9_]{20,}\b', '[REDACTED GITHUB TOKEN]', data)
              data = re.sub(r'\bgithub_pat_[A-Za-z0-9_]{20,}\b', '[REDACTED GITHUB TOKEN]', data)
              path.write_text(data)
          PY

      - name: Upload CI diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ci-diagnostics
          path: ${{ runner.temp }}/ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload db artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@v5
        with:
          name: care-db-dump
          path: care_db.dump
          retention-days: 30
          compression-level: 0 # file is already compressed
      - name: Stop services and clean up
        if: always()
        run: docker compose down --volumes --remove-orphans || true
