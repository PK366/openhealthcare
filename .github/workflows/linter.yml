name: Lint Code Base

on:
  pull_request:
    branches:
      - develop
      - staging
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve changed-file range
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "base=$MERGE_GROUP_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$MERGE_GROUP_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run Python and repository hooks
        run: |
          pre-commit run --show-diff-on-failure --color=always \
            --from-ref "${{ steps.refs.outputs.base }}" \
            --to-ref "${{ steps.refs.outputs.head }}"

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Run frontend ESLint on changed files
        shell: bash
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          mapfile -d '' -t files < <(
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- frontend/src |
            while IFS= read -r -d '' file; do
              if [[ -f "$file" && "$file" =~ \.(js|jsx|ts|tsx)$ ]]; then
                printf '%s\0' "$file"
              fi
            done
          )

          if (( ${#files[@]} == 0 )); then
            echo "No changed frontend source files to lint."
            exit 0
          fi

          npx --prefix frontend eslint "${files[@]}"
